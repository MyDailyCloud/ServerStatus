name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.5'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Run go vet
      run: go vet ./...

    - name: Run go fmt check
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "The following files are not formatted:"
          gofmt -s -l .
          exit 1
        fi

    - name: Run unit tests with coverage
      run: |
        cd data-server
        go test ./internal/config ./internal/service/auth ./internal/service/health ./internal/service/websocket -v -coverprofile=coverage.out -covermode=atomic
        
    - name: Display coverage report
      run: |
        cd data-server
        echo "=== Coverage Summary ==="
        go tool cover -func=coverage.out | tail -1
        
    - name: Check coverage threshold
      run: |
        cd data-server
        COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
        echo "Total coverage: ${COVERAGE}%"
        THRESHOLD=50
        if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
          echo "❌ Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
          exit 1
        else
          echo "✅ Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"
        fi
        
    - name: Upload coverage to artifacts
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: data-server/coverage.out
        retention-days: 30

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: windows
            goarch: amd64
            suffix: ".exe"
          - goos: darwin
            goarch: amd64
            suffix: ""

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.5'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Build data-server
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        mkdir -p release
        cd data-server
        go build -ldflags "-s -w" -o ../release/data-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} *.go

    - name: Build monitor-agent
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        cd monitor-agent
        go build -ldflags "-s -w" -o ../release/monitor-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} *.go

    - name: Create build info
      run: |
        echo "Build Date: $(date +%Y%m%d_%H%M%S)" > release/build-info.txt
        echo "Git Commit: ${GITHUB_SHA:0:7}" >> release/build-info.txt
        echo "Go Version: $(go version)" >> release/build-info.txt
        echo "Platform: ${{ matrix.goos }}/${{ matrix.goarch }}" >> release/build-info.txt

    - name: List built files
      run: ls -la release/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: serverstatus-${{ matrix.goos }}-${{ matrix.goarch }}
        path: release/*
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Prepare release assets
      run: |
        mkdir -p release-final
        find artifacts -name "*" -type f -exec cp {} release-final/ \;
        
        # Copy install.sh from repository root
        cp install.sh release-final/install.sh
        chmod +x release-final/install.sh

        # 重命名文件为更友好的名称
        cd release-final
        if [ -f "data-server-linux-amd64" ]; then
          mv data-server-linux-amd64 data-server-linux
          mv monitor-agent-linux-amd64 monitor-agent-linux
        fi
        if [ -f "data-server-windows-amd64.exe" ]; then
          mv data-server-windows-amd64.exe data-server.exe
          mv monitor-agent-windows-amd64.exe monitor-agent.exe
        fi
        if [ -f "data-server-darwin-amd64" ]; then
          mv data-server-darwin-amd64 data-server-macos
          mv monitor-agent-darwin-amd64 monitor-agent-macos
        fi

        ls -la

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: ServerStatus ${{ github.ref_name }}
        body: |
          # ServerStatus ${{ github.ref_name }} Release

          ## 🚀 新版本特性

          ### 多GPU监控系统
          - ✅ 完整支持NVIDIA多显卡监控
          - ✅ 独立GPU温度、内存使用率、计算使用率监控
          - ✅ 支持CUDA和驱动版本信息

          ### WebSocket实时推送
          - ✅ 实时服务器状态更新
          - ✅ 在线/离线状态通知
          - ✅ 减少轮询，节省带宽

          ### Redis缓存系统
          - ✅ 50-70% API响应速度提升
          - ✅ 多级缓存策略(内存+Redis)
          - ✅ 自动降级机制

          ### Session UUID系统
          - ✅ 基于UUID的客户端标识
          - ✅ 提升追踪准确性
          - ✅ 支持设备统计

          ## 📦 下载文件

          ### 自动安装脚本
          - `install.sh` - 自动安装脚本（支持 Linux/macOS）

          ### Linux
          - `data-server-linux` - 数据服务器 (内存模式)
          - `monitor-agent-linux` - 监控客户端

          ### Windows
          - `data-server.exe` - 数据服务器 (内存模式)
          - `monitor-agent.exe` - 监控客户端

          ### macOS
          - `data-server-macos` - 数据服务器 (内存模式)
          - `monitor-agent-macos` - 监控客户端

          ## 🚀 快速开始

          ### 使用自动安装脚本（推荐）
          ```bash
          # 下载安装脚本
          curl -L https://github.com/MyDailyCloud/ServerStatus/releases/download/${{ github.ref_name }}/install.sh -o install.sh
          chmod +x install.sh
          
          # 安装服务器
          ./install.sh server --port 8080 --key your-key
          
          # 安装客户端
          ./install.sh client --url http://your-server:8080/api/data --key your-key
          ```

          ### 手动安装
          ```bash
          # 启动数据服务器
          ./data-server-linux -port 8080

          # 启动监控客户端
          ./monitor-agent-linux -url http://your-server:8080/api/data -key your-project-key
          ```

          ## 📖 文档
          - [API文档](https://github.com/MyDailyCloud/ServerStatus/blob/main/API.md)
          - [使用说明](https://github.com/MyDailyCloud/ServerStatus/blob/main/README.md)
          - [更新日志](https://github.com/MyDailyCloud/ServerStatus/blob/main/CHANGELOG.md)

          ---
          🤖 Auto-generated by GitHub Actions
        files: release-final/*
        generate_release_notes: false
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
