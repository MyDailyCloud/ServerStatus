name: Docker Build and Push

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.5'

    - name: Run unit tests (data-server)
      run: |
        cd data-server
        go test ./...

    - name: Run unit tests (root module)
      run: |
        go test ./...

    - name: Run unit tests (monitor-agent)
      run: |
        cd monitor-agent
        go test ./...

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set build metadata
      id: buildvars
      run: |
        echo "BUILD_VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
        echo "BUILD_COMMIT=${GITHUB_SHA}" >> $GITHUB_ENV
        echo "BUILD_TIME=$(date -u +%FT%TZ)" >> $GITHUB_ENV
        echo "BUILD_VERSION=${GITHUB_REF_NAME}"
        echo "BUILD_COMMIT=${GITHUB_SHA}"
        echo "BUILD_TIME=$(date -u +%FT%TZ)"
    
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
    
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: deploy/Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          VERSION=${{ env.BUILD_VERSION }}
          GIT_COMMIT=${{ env.BUILD_COMMIT }}
          BUILD_TIME=${{ env.BUILD_TIME }}