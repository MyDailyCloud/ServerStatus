services:
  # 生产最小化：1 个服务端 + 1 个 Agent，密钥从环境注入
  data-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    container_name: serverstatus-server
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      - SERVER_PORT=${SERVER_PORT:-8080}
      - PROJECT_KEY=${PROJECT_KEY:?PROJECT_KEY required}
      - SERVER_KEY=${SERVER_KEY:?SERVER_KEY required}
    volumes:
      - ../data-server/web-ui:/app/web-ui
      - ../data-server/API.md:/app/API.md
      - ../data:/app/data
      - ../data-server/logs:/app/logs
      - ../data-server/exports:/app/exports
    networks:
      - serverstatus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/servers"]
      interval: 10s
      timeout: 5s
      retries: 3

  monitor-agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.agent
    container_name: serverstatus-agent
    hostname: ${AGENT_HOSTNAME:-serverstatus-agent}
    environment:
      - SERVER_URL=${SERVER_URL:-http://data-server:8080/api/data}
      - PROJECT_KEY=${PROJECT_KEY:?PROJECT_KEY required}
      - SERVER_KEY=${SERVER_KEY:?SERVER_KEY required}
      - ENABLE_USER_RESOURCES=${ENABLE_USER_RESOURCES:-false}
    depends_on:
      data-server:
        condition: service_healthy
    networks:
      - serverstatus
    restart: unless-stopped

  # 可选：简单静态前端，生产可自行替换或移除
  frontend:
    image: python:3.9-slim
    container_name: serverstatus-frontend
    ports:
      - "8081:8000"
    volumes:
      - ../frontend-ui:/app:ro
    working_dir: /app
    command: python -m http.server 8000
    networks:
      - serverstatus
    depends_on:
      - data-server

networks:
  serverstatus:
    driver: bridge