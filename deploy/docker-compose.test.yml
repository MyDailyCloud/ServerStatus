services:
  # Data Server - 测试/演示用 API 服务器
  data-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    container_name: serverstatus-server
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - PROJECT_KEY=test-demo-01
      - SERVER_KEY=test-secret-01
    volumes:
      - ../data-server/web-ui:/app/web-ui
      - ../data-server/API.md:/app/API.md
      - ../data:/app/data
      - ../data-server/logs:/app/logs
      - ../data-server/exports:/app/exports
    networks:
      - serverstatus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/servers"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Monitor Agent - 监控客户端1
  monitor-agent-1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.agent
    container_name: serverstatus-agent-1
    hostname: test-server-1
    environment:
      - SERVER_URL=http://data-server:8080/api/data
      - PROJECT_KEY=test-demo-01
      - SERVER_KEY=test-secret-01
      - ENABLE_USER_RESOURCES=true
    depends_on:
      data-server:
        condition: service_healthy
    networks:
      - serverstatus
    restart: unless-stopped

  # Monitor Agent - 监控客户端2
